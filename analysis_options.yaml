# =============================================================================
# Lotus ERP — Static Analysis Configuration
# =============================================================================
# This file configures the Dart analyzer and linter rules.
# Invoke via: flutter analyze
# =============================================================================

analyzer:
  errors:
    # Surface deprecation warnings so upgrade debt is visible, but don't block builds.
    deprecated_member_use: warning
  exclude:
    - lib/database/db/*.g.dart
    - .dart_tool/**
    - build/**

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # ── SAFETY (must remain enabled) ──────────────────────────────────────────
    # Prevents using BuildContext after await — causes crashes when widget is
    # disposed during async gap. This is the #1 crash-prevention lint.
    use_build_context_synchronously: true

    # Enforces structured logging via AppLogger instead of print/debugPrint.
    avoid_print: true

    # Requires explicit types for uninitialized variables — improves type safety.
    prefer_typing_uninitialized_variables: true

    # Requires curly braces in if/else/for/while — prevents subtle bugs.
    curly_braces_in_flow_control_structures: true

    # ── RELAXED (low risk, would require extensive refactoring) ───────────────
    # Many widgets use private State types in public API — standard Flutter pattern.
    library_private_types_in_public_api: false
